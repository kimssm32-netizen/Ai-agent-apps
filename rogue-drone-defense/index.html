<style>
:root{--gold:#ffd76a;--cyan:#68e8ff;--glass:#091522c9;--line:#ffffff24;--txt:#f4f8ff}

.top{display:flex;gap:7px;align-items:flex-start}.card{background:linear-gradient(145deg,#102437de,#06111ddd);border:1px solid var(--line);box-shadow:0 8px 25px #0008,inset 0 1px #ffffff17;border-radius:13px;backdrop-filter:blur(8px)}
.profile{display:flex;align-items:center;padding:7px 9px;min-width:145px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#56d8ff,#3154aa);border:2px solid #c3f5ff;font-size:18px}.ptext{margin-left:8px;font-size:10px;color:#9fb4c8}.ptext b{display:block;color:white;font-size:12px}.bar{margin-top:4px;width:82px;height:5px;border-radius:8px;background:#0008;overflow:hidden}.bar i{display:block;height:100%;width:78%;background:linear-gradient(90deg,#39d78b,#a5ffb9)}
.stats{margin-left:auto;padding:7px 10px;text-align:right;font-size:10px;line-height:1.55;color:#a9bbcc}.stats strong{font-size:13px;color:var(--gold)}
#quest{position:absolute;top:78px;left:10px;width:min(250px,62vw);padding:9px 11px;font-size:11px;line-height:1.45}.qtitle{color:var(--gold);font-weight:900}.progress{height:4px;margin-top:7px;background:#0008;border-radius:4px;overflow:hidden}.progress i{display:block;width:0%;height:100%;background:var(--gold);transition:.3s}

#weather{position:absolute;right:10px;top:78px;padding:8px 10px;font-size:11px;text-align:right;line-height:1.5}
#interact{pointer-events:auto;position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:74px;height:74px;border-radius:50%;border:2px solid #ffffff75;background:radial-gradient(circle at 35% 30%,#69eaff,#1873a4);color:white;font-size:11px;font-weight:900;box-shadow:0 5px 22px #008fd788;display:none}
#joy{pointer-events:auto;position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 26px);width:112px;height:112px;border-radius:50%;background:#07152288;border:1px solid #ffffff35;box-shadow:inset 0 0 30px #0008}.knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#d9f8ffcc,#69b8d4aa);border:2px solid #fff9;box-shadow:0 4px 12px #0009}

#panel{position:absolute;z-index:12;inset:0;display:none;align-items:flex-end;background:#0008;pointer-events:auto}.sheet{width:100%;max-height:74%;overflow:auto;padding:22px 18px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(#12283bf5,#07121dfb);border-top:1px solid #ffffff30;border-radius:24px 24px 0 0;box-shadow:0 -15px 50px #000}.sheet h2{margin:0 0 5px;color:var(--gold)}.sheet p{font-size:12px;color:#b9cad8;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:13px;border-radius:14px;background:#ffffff0c;border:1px solid #ffffff18}.item b{display:block;font-size:13px}.item small{color:#9eb1c2}.buy,.close{margin-top:9px;border:0;border-radius:10px;padding:9px 11px;font-weight:900}.buy{background:#ffd76a;color:#201900}.close{width:100%;background:#ffffff18;color:white;padding:13px}
#start{position:absolute;z-index:30;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 22px calc(env(safe-area-inset-bottom) + 30px);background:linear-gradient(0deg,#030912 5%,#06101dbd 45%,transparent 80%)}#start:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 70% 20%,#5bc6ff44,transparent 35%),linear-gradient(145deg,#182f48,#07111d 55%,#02060a)}
.logo{font-size:clamp(38px,12vw,68px);line-height:.95;letter-spacing:-4px;font-weight:1000;text-shadow:0 4px 30px #51cdf966}.logo span{display:block;color:var(--cyan);font-size:.38em;letter-spacing:3px;margin-bottom:8px}.desc{max-width:480px;color:#b5c9d9;font-size:13px;line-height:1.7}.features{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px}.features i{font-style:normal;font-size:10px;border:1px solid #ffffff28;border-radius:20px;padding:6px 9px;background:#ffffff0d}.startBtn{border:0;border-radius:17px;padding:17px;font-size:16px;font-weight:1000;color:#062034;background:linear-gradient(135deg,#b9f6ff,#48d7ff);box-shadow:0 9px 35px #23bce255}
</style>
</head>
<body><div id="app"><canvas id="game"></canvas><canvas id="rain"></canvas>
<div id="hud">
 <div class="top"><div class="card profile"><div class="avatar">🧑</div><div class="ptext"><b>시민 한결 · Lv. 7</b>체력<div class="bar"><i id="hpbar"></i></div></div></div><div class="card stats">자산 <strong id="money">₩ 12,500</strong><br><span id="clock">월요일 08:20</span></div></div>
 <div id="quest" class="card"><div class="qtitle">◆ 오늘의 목표</div>도시 주민 3명과 대화하기 <b id="qp">0 / 3</b><div class="progress"><i id="qbar"></i></div></div>
 <div id="weather" class="card"><b id="weatherName">☀️ 맑음</b><br><span id="temp">18°C · 경제 안정</span></div>
 <canvas id="map"></canvas><div id="cross"></div><div id="message"></div><div id="joy"><div class="knob"></div></div><button id="interact">대화<br>하기</button><div id="lookHint">화면을 밀어 둘러보기</div>
</div>
<div id="panel"><div class="sheet"><h2 id="panelTitle">상점</h2><p id="panelDesc"></p><div id="items" class="grid"></div><button class="close">닫기</button></div></div>
<section id="start"><div class="logo"><span>LIVING CITY RPG</span>리얼월드</div><p class="desc">경제와 인구가 움직이고, 날씨와 시간이 흐르는 살아있는 3D 도시입니다. 거리를 걷고 주민과 대화하며 상점·은행·주택을 이용하세요.</p><div class="features"><i>🏙️ 절차 생성 도시</i><i>👥 주민 생활 AI</i><i>📈 실시간 경제</i><i>🌦️ 동적 날씨</i><i>🌙 낮과 밤</i></div><button class="startBtn">도시에 입장하기</button></section>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),cv=$('#game'),ctx=cv.getContext('2d'),rc=$('#rain'),rx=rc.getContext('2d'),mm=$('#map'),mx=mm.getContext('2d');
let W,H,D=1,started=false,last=0,player={x:3.5,y:13.5,a:0},keys={},joy={x:0,y:0},lookId=null,lookX=0,money=12500,talked=0,worldMin=480,day=0,weather=0,weatherT=35,economy=1,population=28410,near=null,msgT=0;
const N=24, map=Array.from({length:N},()=>Array(N).fill(0));
// 0 road/open, 1 office, 2 brick, 3 shop, 4 bank, 5 home, 6 park wall
for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(x==0||y==0||x==N-1||y==N-1)map[y][x]=1;else if(x%6>1&&y%6>1){let edge=x%6==2||y%6==2||x%6==5||y%6==5;if(edge||Math.random()<.28)map[y][x]=1+((x*7+y*3)%6)}}
for(let y=11;y<=14;y++)for(let x=1;x<N-1;x++)map[y][x]=0;for(let x=10;x<=13;x++)for(let y=1;y<N-1;y++)map[y][x]=0;
const labels=[{x:4.5,y:11.1,t:'시민 마트',type:'shop'},{x:10.2,y:7.5,t:'미래 은행',type:'bank'},{x:15.5,y:14.8,t:'시청 광장',type:'city'},{x:13.8,y:18.5,t:'한강 주택',type:'home'}];
const names=['김민준','박서연','이도윤','최지우','한유진','윤시후','오하린','정도현','강수아','임지호'];
const lines=['오늘 물가가 조금 올랐네요.','공원 쪽 풍경이 정말 좋아요.','퇴근하고 마트에 들를 거예요.','새 일자리가 생겼다는군요!','비가 오기 전에 집에 가야겠어요.','이 도시는 매일 달라지는 것 같아요.'];
let npcs=Array.from({length:18},(_,i)=>{let p;do p={x:1.5+Math.random()*(N-3),y:1.5+Math.random()*(N-3)};while(map[p.y|0][p.x|0]);return{...p,a:Math.random()*6.28,v:.25+Math.random()*.3,name:names[i%names.length],mood:Math.random(),color:`hsl(${i*47%360} 55% 65%)`,wait:0}});
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.7);for(const c of[cv,rc]){c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(D,0,0,D,0,0)}mm.width=184;mm.height=184;mx.setTransform(2,0,0,2,0,0)}addEventListener('resize',resize);resize();
const colors={1:['#496a83','#29475e'],2:['#8a554a','#5c342f'],3:['#568f89','#315e5a'],4:['#b5a36e','#6e623e'],5:['#8b7892','#59495f'],6:['#47754f','#2e5034']};
function solid(x,y){return x<0||y<0||x>=N||y>=N||map[y|0][x|0]>0}
function ray(a){let dx=Math.cos(a),dy=Math.sin(a),x=player.x,y=player.y,d=0,side=0;while(d<28){x+=dx*.035;y+=dy*.035;d+=.035;if(solid(x,y)){let fx=x-Math.floor(x),fy=y-Math.floor(y);side=Math.min(fx,1-fx)<Math.min(fy,1-fy);return{d,x,y,t:map[y|0]?.[x|0]||1,side}}}return{d:28,t:1,side:0}}
function render(){let hour=(worldMin/60)%24, sun=Math.max(.08,Math.sin((hour-5)/24*Math.PI*2)*.48+.52),skyTop=weather==2?'#27323c':hour>18||hour<6?'#081326':'#4d9bd0',skyBot=weather==2?'#65717a':hour>18||hour<6?'#293550':'#bde4ee';let g=ctx.createLinearGradient(0,0,0,H*.58);g.addColorStop(0,skyTop);g.addColorStop(1,skyBot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.58);ctx.fillStyle=`rgba(255,245,203,${sun*.8})`;ctx.beginPath();ctx.arc(W*.76,H*.17,28,0,7);ctx.fill();ctx.fillStyle=hour>18||hour<6?'#171c2b':'#68747a';ctx.fillRect(0,H*.5,W,H*.5);
 let cols=Math.min(420,Math.ceil(W/2)),cw=W/cols+1,z=[];for(let i=0;i<cols;i++){let ra=player.a-.56+i/(cols-1)*1.12,r=ray(ra),dist=r.d*Math.cos(ra-player.a),wh=Math.min(H*1.35,H/dist),top=H*.5-wh*.5,type=colors[r.t]||colors[1],shade=Math.max(.2,sun*(1-r.d/34))*(r.side?.78:1);ctx.fillStyle=shadeColor(type[((r.x+r.y)*3|0)%2],shade);ctx.fillRect(i*cw,top,cw+1,wh);if(r.t==3&&wh>80){ctx.fillStyle=`rgba(255,220,90,${shade})`;ctx.fillRect(i*cw,top+wh*.58,cw+1,wh*.22)}if(r.t==4&&wh>80){ctx.fillStyle=`rgba(130,220,255,${shade})`;ctx.fillRect(i*cw,top+wh*.18,cw+1,wh*.22)}if(wh>55&&i%4==0){ctx.fillStyle=`rgba(190,225,242,${.25*shade})`;ctx.fillRect(i*cw,top+wh*.17,cw*.72,Math.max(2,wh*.09));ctx.fillRect(i*cw,top+wh*.38,cw*.72,Math.max(2,wh*.09))}z[i]=dist}
 renderSprites(z,cols,cw,sun);if(weather==2)drawRain();else rx.clearRect(0,0,W,H);drawMap();}
function shadeColor(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgb(${r*k|0},${g*k|0},${b*k|0})`}
function renderSprites(z,cols,cw,sun){let sprites=[...npcs.map(n=>({...n,kind:'npc'})),...labels.map(n=>({...n,kind:'label'}))];sprites.sort((a,b)=>((b.x-player.x)**2+(b.y-player.y)**2)-((a.x-player.x)**2+(a.y-player.y)**2));near=null;for(let s of sprites){let dx=s.x-player.x,dy=s.y-player.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-player.a;while(ang>Math.PI)ang-=6.283;while(ang<-Math.PI)ang+=6.283;if(Math.abs(ang)>.7||dist<.25)continue;let sx=(ang/1.12+.5)*W,idx=Math.max(0,Math.min(cols-1,(sx/W*cols)|0));if(z[idx]<dist)continue;let size=Math.min(H*.7,H/dist*(s.kind==='npc'?.58:.3)),base=H*.5+size*.48;if(s.kind==='npc'){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(sx,base,size*.24,size*.07,0,0,7);ctx.fill();ctx.fillStyle=s.color;ctx.fillRect(sx-size*.16,base-size*.62,size*.32,size*.52);ctx.fillStyle='#dfaf8d';ctx.beginPath();ctx.arc(sx,base-size*.76,size*.14,0,7);ctx.fill();ctx.fillStyle='#15191d';ctx.beginPath();ctx.arc(sx,base-size*.8,size*.145,3.15,6.25);ctx.fill();ctx.textAlign='center';ctx.font=`700 ${Math.max(9,size*.07)}px sans-serif`;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(s.name,sx,base-size*.98);ctx.fillText(s.name,sx,base-size*.98);if(dist<1.45&&Math.abs(ang)<.22)near=s}else{ctx.textAlign='center';ctx.font=`900 ${Math.max(10,size*.12)}px sans-serif`;ctx.fillStyle='#ffe281';ctx.strokeStyle='#000b';ctx.lineWidth=4;ctx.strokeText(s.t,sx,base-size*.7);ctx.fillText(s.t,sx,base-size*.7);if(dist<1.6&&Math.abs(ang)<.25)near=s}}
$('#interact').style.display=near?'block':'none';if(near)$('#interact').innerHTML=near.kind==='npc'?'대화<br>하기':'이용<br>하기'}
function drawRain(){rx.clearRect(0,0,W,H);rx.strokeStyle='#c7e8ff77';rx.lineWidth=1.2;rx.beginPath();let t=performance.now()*.7;for(let i=0;i<90;i++){let x=(i*79+t*.08)% (W+80)-40,y=(i*137+t)%(H+80)-40;rx.moveTo(x,y);rx.lineTo(x-7,y+19)}rx.stroke()}
function drawMap(){mx.clearRect(0,0,92,92);mx.save();mx.translate(46,46);mx.rotate(-player.a+Math.PI/2);let sc=3.3;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]){mx.fillStyle=colors[map[y][x]][0];mx.fillRect((x-player.x)*sc,(y-player.y)*sc,sc+.3,sc+.3)}mx.fillStyle='#ffd76a';for(let n of npcs)mx.fillRect((n.x-player.x)*sc-1,(n.y-player.y)*sc-1,2,2);mx.restore();mx.fillStyle='#69efff';mx.beginPath();mx.moveTo(46,40);mx.lineTo(42,51);mx.lineTo(50,51);mx.closePath();mx.fill()}
function tick(dt){worldMin+=dt*2.4;weatherT-=dt;if(weatherT<0){weather=(weather+1)%3;weatherT=35+Math.random()*35;notify(['맑은 날씨가 시작됐습니다.','구름이 도시를 덮습니다.','빗방울이 떨어지기 시작합니다.'][weather])}economy+=(Math.random()-.5)*dt*.001;economy=Math.max(.91,Math.min(1.12,economy));let f=joy.y,st=joy.x;if(keys.w)f=-1;if(keys.s)f=1;if(keys.a)st=-1;if(keys.d)st=1;let speed=dt*2.25,nx=player.x+Math.cos(player.a)*(-f)*speed+Math.cos(player.a+1.57)*st*speed,ny=player.y+Math.sin(player.a)*(-f)*speed+Math.sin(player.a+1.57)*st*speed;if(!solid(nx,player.y))player.x=nx;if(!solid(player.x,ny))player.y=ny;for(let n of npcs){n.wait-=dt;if(n.wait<0){if(Math.random()<.018){n.a+=Math.random()*2-1;n.wait=Math.random()*2}else{let nx=n.x+Math.cos(n.a)*n.v*dt,ny=n.y+Math.sin(n.a)*n.v*dt;if(solid(nx,ny)){n.a+=1.5+Math.random()*2;n.wait=.5}else{n.x=nx;n.y=ny}}}}updateUI()}
function updateUI(){let d=Math.floor(worldMin/1440),m=((worldMin%1440)+1440)%1440,h=(m/60)|0,mi=m%60|0;$('#clock').textContent=['월','화','수','목','금','토','일'][d%7]+'요일 '+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');$('#money').textContent='₩ '+money.toLocaleString();let wn=['☀️ 맑음','⛅ 흐림','🌧️ 비'][weather];$('#weatherName').textContent=wn;$('#temp').textContent=(weather==2?15:weather==1?17:21)+'°C · 경제 '+(economy>1.02?'호황':economy<.97?'둔화':'안정');if(msgT>0){msgT-=.016;if(msgT<=0)$('#message').classList.remove('show')}}
function notify(t){let m=$('#message');m.textContent=t;m.classList.add('show');msgT=2.4}
function interact(){if(!near)return;if(near.kind==='npc'){notify(near.name+' : “'+lines[Math.random()*lines.length|0]+'”');if(!near.done){near.done=1;talked++;money+=120;$('#qp').textContent=talked+' / 3';$('#qbar').style.width=Math.min(100,talked/3*100)+'%';if(talked==3){money+=1500;setTimeout(()=>notify('목표 완료! 보상 ₩1,500'),700)}}}else openPanel(near)}
function openPanel(s){let data={shop:['시민 마트','생활에 필요한 물품을 구매합니다.',[['따뜻한 커피','₩ 1,800','☕'],['도시락','₩ 4,500','🍱'],['우산','₩ 9,000','☂️'],['운동화','₩ 42,000','👟']]],bank:['미래 은행','예금 금리는 경제 상황에 따라 변합니다.',[['보통 예금','금리 '+(2.1*economy).toFixed(2)+'%','🏦'],['도시 펀드','위험도 보통','📊']]],city:['시청 광장','도시 인구 '+population.toLocaleString()+'명 · 만족도 82%',[['구인 게시판','일자리 316개','💼'],['시민 통계','인구 증가 +1.2%','👥']]],home:['한강 주택','내 집을 관리하고 휴식합니다.',[['휴식하기','체력 회복','🛏️'],['인테리어','가구 편집','🪴']]]}[s.type]||['시설','도시 시설입니다.',[]];$('#panelTitle').textContent=data[0];$('#panelDesc').textContent=data[1];$('#items').innerHTML=data[2].map((it,i)=>`<div class="item"><b>${it[2]} ${it[0]}</b><small>${it[1]}</small><button class="buy" data-i="${i}">선택</button></div>`).join('');$('#panel').style.display='flex';document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{notify('서비스를 이용했습니다.');if(s.type==='shop'){let cost=[1800,4500,9000,42000][+b.dataset.i];if(money>=cost)money-=cost;else notify('잔액이 부족합니다.')}$('#panel').style.display='none'})}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(started)tick(dt);render();requestAnimationFrame(loop)}
const joyEl=$('#joy'),knob=$('.knob');function setJoy(e){let r=joyEl.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-r.left-r.width/2,dy=p.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),max=34;if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);setJoy(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)setJoy(e)});function joyEnd(){joy.x=joy.y=0;knob.style.transform=''}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
cv.addEventListener('pointerdown',e=>{lookId=e.pointerId;lookX=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(e.pointerId===lookId){player.a+=(e.clientX-lookX)*.006;lookX=e.clientX}});cv.addEventListener('pointerup',()=>lookId=null);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='ArrowLeft')player.a-=.12;if(e.key==='ArrowRight')player.a+=.12});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);$('#interact').onclick=interact;$('.close').onclick=()=>$('#panel').style.display='none';$('#panel').onclick=e=>{if(e.target===$('#panel'))$('#panel').style.display='none'};$('.startBtn').onclick=()=>{$('#start').style.display='none';started=true;notify('리얼월드에 오신 것을 환영합니다!')};requestAnimationFrame(loop);
})();
</script></body></html>
