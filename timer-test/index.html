<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>간단한 타이머</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #151c31;
      --card-2: #1c2540;
      --text: #f8fafc;
      --muted: #a8b3cf;
      --primary: #7c5cff;
      --primary-hover: #8d73ff;
      --danger: #ef5b69;
      --ring: rgba(124, 92, 255, 0.28);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 92, 255, 0.24), transparent 35%),
        linear-gradient(180deg, #10162a 0%, var(--bg) 100%);
    }

    .app {
      width: min(100%, 420px);
      padding: clamp(22px, 6vw, 32px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      background: rgba(21, 28, 49, 0.92);
      box-shadow: 0 24px 70px rgba(0,0,0,0.38);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .timer-wrap {
      display: grid;
      place-items: center;
      width: min(72vw, 280px);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      padding: 12px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) var(--progress, 0%), rgba(255,255,255,0.08) 0);
      box-shadow: 0 0 0 10px var(--ring), inset 0 0 30px rgba(0,0,0,0.18);
    }

    .timer-face {
      display: grid;
      place-items: center;
      align-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #11182c;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.65rem, 13vw, 4rem);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .status {
      min-height: 1.4em;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: var(--card-2);
      font: inherit;
      font-size: 1rem;
      text-align: center;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      min-width: 0;
      min-height: 50px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      color: var(--text);
      background: var(--card-2);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.985); }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    .primary { background: var(--primary); }
    .primary:hover { background: var(--primary-hover); }
    .danger { color: #ffd9dd; background: rgba(239,91,105,0.14); }
    .preset { min-height: 42px; font-size: 0.84rem; }

    @media (max-width: 350px) {
      .app { padding: 20px 16px; border-radius: 22px; }
      .presets { gap: 6px; }
      .preset { padding-inline: 8px; font-size: 0.78rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <h1 id="title">간단한 타이머</h1>
    <p class="subtitle">시간을 설정하고 타이머를 시작하세요.</p>

    <section class="timer-wrap" id="timerRing" aria-label="타이머 진행률">
      <div class="timer-face">
        <div class="time" id="display" role="timer" aria-live="off">05:00</div>
        <div class="status" id="status" aria-live="polite">준비</div>
      </div>
    </section>

    <div class="inputs">
      <label>분
        <input id="minutes" type="number" inputmode="numeric" min="0" max="999" value="5" aria-label="분 입력">
      </label>
      <label>초
        <input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="초 입력">
      </label>
    </div>

    <div class="presets" aria-label="빠른 시간 설정">
      <button class="preset" data-seconds="60">1분</button>
      <button class="preset" data-seconds="300">5분</button>
      <button class="preset" data-seconds="600">10분</button>
    </div>

    <div class="controls">
      <button class="primary" id="startPause">시작</button>
      <button class="danger" id="reset">초기화</button>
    </div>
  </main>

  <script>
    (() => {
      const display = document.getElementById('display');
      const status = document.getElementById('status');
      const ring = document.getElementById('timerRing');
      const minutesInput = document.getElementById('minutes');
      const secondsInput = document.getElementById('seconds');
      const startPauseButton = document.getElementById('startPause');
      const resetButton = document.getElementById('reset');
      const presetButtons = document.querySelectorAll('.preset');

      let totalSeconds = 300;
      let remainingSeconds = 300;
      let running = false;
      let endTime = 0;
      let intervalId = null;

      const clampNumber = (value, min, max) => Math.min(max, Math.max(min, Number(value) || 0));

      function formatTime(seconds) {
        const safe = Math.max(0, Math.ceil(seconds));
        const minutes = Math.floor(safe / 60);
        const secs = safe % 60;
        return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function render() {
        display.textContent = formatTime(remainingSeconds);
        document.title = `${formatTime(remainingSeconds)} · 타이머`;
        const progress = totalSeconds > 0 ? ((totalSeconds - remainingSeconds) / totalSeconds) * 100 : 0;
        ring.style.setProperty('--progress', `${Math.min(100, Math.max(0, progress))}%`);
      }

      function readInputs() {
        const minutes = clampNumber(minutesInput.value, 0, 999);
        const seconds = clampNumber(secondsInput.value, 0, 59);
        minutesInput.value = minutes;
        secondsInput.value = seconds;
        totalSeconds = minutes * 60 + seconds;
        remainingSeconds = totalSeconds;
        render();
      }

      function syncInputs(seconds) {
        minutesInput.value = Math.floor(seconds / 60);
        secondsInput.value = seconds % 60;
      }

      function stopInterval() {
        if (intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      function finish() {
        running = false;
        stopInterval();
        remainingSeconds = 0;
        startPauseButton.textContent = '다시 시작';
        status.textContent = '시간 종료!';
        render();
        if ('vibrate' in navigator) navigator.vibrate([180, 100, 180]);
      }

      function tick() {
        const millisecondsLeft = endTime - Date.now();
        remainingSeconds = Math.max(0, millisecondsLeft / 1000);
        if (millisecondsLeft <= 0) finish();
        else render();
      }

      function start() {
        if (remainingSeconds <= 0) readInputs();
        if (remainingSeconds <= 0) {
          status.textContent = '시간을 입력해 주세요.';
          return;
        }
        running = true;
        endTime = Date.now() + remainingSeconds * 1000;
        startPauseButton.textContent = '일시정지';
        status.textContent = '진행 중';
        intervalId = setInterval(tick, 200);
        tick();
      }

      function pause() {
        tick();
        running = false;
        stopInterval();
        remainingSeconds = Math.ceil(remainingSeconds);
        startPauseButton.textContent = '계속';
        status.textContent = '일시정지';
        render();
      }

      startPauseButton.addEventListener('click', () => running ? pause() : start());

      resetButton.addEventListener('click', () => {
        running = false;
        stopInterval();
        readInputs();
        startPauseButton.textContent = '시작';
        status.textContent = '준비';
        document.title = '간단한 타이머';
      });

      [minutesInput, secondsInput].forEach(input => {
        input.addEventListener('change', () => {
          if (!running) {
            readInputs();
            startPauseButton.textContent = '시작';
            status.textContent = '준비';
          }
        });
      });

      presetButtons.forEach(button => {
        button.addEventListener('click', () => {
          running = false;
          stopInterval();
          totalSeconds = Number(button.dataset.seconds);
          remainingSeconds = totalSeconds;
          syncInputs(totalSeconds);
          startPauseButton.textContent = '시작';
          status.textContent = '준비';
          render();
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && running) tick();
      });

      render();
    })();
  </script>
</body>
</html>
