<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단한 타이머</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
    }
    .card {
      width: min(92vw, 420px);
      padding: 32px;
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 20px 50px rgba(79,70,229,.15);
      text-align: center;
    }
    h1 { margin: 0 0 22px; font-size: 24px; }
    .inputs { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 22px; }
    input {
      width: 82px;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 17px;
      text-align: center;
    }
    .time {
      margin: 12px 0 26px;
      font-size: clamp(54px, 16vw, 76px);
      font-weight: 750;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
    }
    .buttons { display: flex; gap: 10px; justify-content: center; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #start { background: #4f46e5; color: white; }
    #pause { background: #e5e7eb; color: #1f2937; }
    #reset { background: #fee2e2; color: #b91c1c; }
    button:active { transform: scale(.97); }
    .done { color: #dc2626; animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.05); } }
  </style>
</head>
<body>
  <main class="card">
    <h1>⏱️ 간단한 타이머</h1>
    <div class="inputs">
      <input id="minutes" type="number" min="0" max="999" value="5" aria-label="분" />
      <span>분</span>
      <input id="seconds" type="number" min="0" max="59" value="0" aria-label="초" />
      <span>초</span>
    </div>
    <div id="display" class="time" aria-live="polite">05:00</div>
    <div class="buttons">
      <button id="start">시작</button>
      <button id="pause">일시정지</button>
      <button id="reset">초기화</button>
    </div>
  </main>
  <script>
    const minInput = document.getElementById('minutes');
    const secInput = document.getElementById('seconds');
    const display = document.getElementById('display');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const resetBtn = document.getElementById('reset');
    let remaining = 300;
    let timer = null;

    function inputSeconds() {
      const m = Math.max(0, Number(minInput.value) || 0);
      const s = Math.min(59, Math.max(0, Number(secInput.value) || 0));
      return Math.floor(m * 60 + s);
    }
    function render() {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      display.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    function syncFromInputs() {
      if (!timer) { remaining = inputSeconds(); render(); display.classList.remove('done'); }
    }
    minInput.addEventListener('input', syncFromInputs);
    secInput.addEventListener('input', syncFromInputs);

    startBtn.addEventListener('click', () => {
      if (timer) return;
      if (remaining <= 0) remaining = inputSeconds();
      if (remaining <= 0) return;
      display.classList.remove('done');
      timer = setInterval(() => {
        remaining--;
        render();
        if (remaining <= 0) {
          clearInterval(timer);
          timer = null;
          display.classList.add('done');
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    });
    pauseBtn.addEventListener('click', () => {
      clearInterval(timer);
      timer = null;
    });
    resetBtn.addEventListener('click', () => {
      clearInterval(timer);
      timer = null;
      remaining = inputSeconds();
      display.classList.remove('done');
      render();
    });
    render();
  </script>
</body>
</html>
