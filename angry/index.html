<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171524" />
  <title>Angry - 스트레스 해소 게임</title>
  <style>
    :root{
      --bg:#171524; --panel:#242137; --ink:#fff9ed; --muted:#aaa5bd;
      --hot:#ff5b4d; --gold:#ffd45d; --mint:#79e3bd; --purple:#9b7cff;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:manipulation;user-select:none}
    body{min-height:100dvh;background:radial-gradient(circle at 50% 28%,#393054 0,#201c32 44%,#12111c 100%)}
    button{font:inherit;color:inherit}
    .app{height:100dvh;max-width:520px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow:hidden;border-inline:1px solid #ffffff0a}
    header{padding:max(14px,env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;z-index:5}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ff755d,#df2c45);box-shadow:0 7px 20px #ff4c4c42;display:grid;place-items:center;font-weight:1000;font-size:22px;transform:rotate(-5deg)}
    h1{font-size:20px;margin:0;font-weight:950;letter-spacing:-.5px}.sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
    .icon-btn{margin-left:auto;width:42px;height:42px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff0c;display:grid;place-items:center;cursor:pointer}
    main{position:relative;min-height:0;display:flex;flex-direction:column}
    .stats{display:grid;grid-template-columns:1fr auto;gap:12px;padding:5px 16px 0;align-items:end;z-index:4}
    .labelrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:850;margin-bottom:7px}.labelrow span:last-child{color:var(--mint)}
    .meter{height:12px;border-radius:99px;background:#0e0d16;overflow:hidden;border:1px solid #ffffff12;box-shadow:inset 0 2px 4px #0008}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--gold),var(--mint));border-radius:inherit;transition:width .28s ease;box-shadow:0 0 12px #79e3bd88}
    .score{text-align:right}.score small{display:block;color:var(--muted);font-size:10px;font-weight:800}.score strong{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
    .arena{position:relative;flex:1;min-height:280px;overflow:hidden;isolation:isolate}
    .arena:before{content:"";position:absolute;left:8%;right:8%;bottom:7%;height:18%;border-radius:50%;background:#09081299;filter:blur(3px)}
    .hint{position:absolute;top:7%;left:50%;transform:translateX(-50%);white-space:nowrap;color:#d8d4e3;font-size:13px;font-weight:800;background:#11101bb8;border:1px solid #ffffff14;padding:8px 13px;border-radius:99px;animation:breathe 1.8s infinite;z-index:3;pointer-events:none}
    @keyframes breathe{50%{transform:translateX(-50%) translateY(-3px);box-shadow:0 5px 18px #0005}}
    .character-wrap{position:absolute;left:50%;bottom:3%;width:230px;height:330px;transform:translateX(-50%);transform-origin:50% 90%;will-change:transform;cursor:crosshair}
    .character{position:absolute;inset:0;filter:drop-shadow(0 15px 13px #0007);transform-origin:50% 88%}
    .body{position:absolute;left:51px;top:157px;width:130px;height:142px;background:linear-gradient(100deg,#ef3e47,#bb263d);border:5px solid #24152b;border-radius:58px 58px 35px 35px;overflow:hidden}
    .body:after{content:"A";position:absolute;left:50%;top:24px;transform:translateX(-50%) rotate(-7deg);font-size:52px;font-weight:1000;color:#ffcf55;text-shadow:3px 3px 0 #6d1931}
    .head{position:absolute;left:35px;top:23px;width:160px;height:160px;background:linear-gradient(145deg,#f56f50 5%,#e6423d 70%);border:5px solid #24152b;border-radius:46% 49% 43% 47%;z-index:2}
    .ear{position:absolute;top:58px;width:35px;height:55px;background:#df493e;border:5px solid #24152b}.ear.l{left:19px;border-radius:60% 25% 40% 60%;transform:rotate(-14deg)}.ear.r{right:18px;border-radius:25% 60% 60% 40%;transform:rotate(14deg)}
    .brow{position:absolute;top:55px;width:48px;height:11px;background:#24152b;border-radius:9px;z-index:4}.brow.l{left:24px;transform:rotate(18deg)}.brow.r{right:24px;transform:rotate(-18deg)}
    .eye{position:absolute;top:73px;width:35px;height:27px;background:#fff4dc;border:4px solid #24152b;border-radius:45%;z-index:3;overflow:hidden}.eye.l{left:28px}.eye.r{right:28px}.eye:after{content:"";position:absolute;width:10px;height:13px;border-radius:50%;background:#24152b;left:10px;top:5px}
    .nose{position:absolute;left:68px;top:94px;width:22px;height:16px;background:#bd2f36;border:3px solid #24152b;border-radius:50%;z-index:4}
    .mouth{position:absolute;left:45px;top:119px;width:64px;height:23px;border:5px solid #24152b;border-top:0;border-radius:0 0 50% 50%;z-index:4;transition:.1s}.mouth:after{content:"";position:absolute;left:18px;bottom:0;width:28px;height:8px;background:#ff8990;border-radius:50% 50% 0 0}
    .tuft{position:absolute;top:-17px;left:57px;width:30px;height:52px;background:#e85343;border:5px solid #24152b;transform:rotate(-25deg);border-radius:80% 10% 80% 20%;z-index:-1}.tuft.t2{left:91px;top:-20px;transform:rotate(18deg);height:55px}
    .arm{position:absolute;top:169px;width:48px;height:112px;background:#d93440;border:5px solid #24152b;border-radius:40px;z-index:-1;transform-origin:50% 12%}.arm.l{left:24px;transform:rotate(18deg)}.arm.r{right:22px;transform:rotate(-18deg)}
    .leg{position:absolute;top:271px;width:52px;height:55px;background:#7c4cdd;border:5px solid #24152b;border-radius:12px 12px 24px 24px;z-index:-2}.leg.l{left:54px;transform:rotate(4deg)}.leg.r{right:48px;transform:rotate(-4deg)}
    .bruise,.scratch{position:absolute;z-index:7;pointer-events:none;opacity:0;transition:opacity .15s}.bruise{width:25px;height:18px;border-radius:50%;background:#78418e88;border:2px solid #5f2c7799}.scratch{width:30px;height:19px}.scratch:before,.scratch:after{content:"";position:absolute;width:24px;height:3px;background:#842b3a;border-radius:3px;transform:rotate(-25deg)}.scratch:after{top:9px;left:4px}
    .bruise.b1{left:49px;top:68px}.bruise.b2{right:38px;top:105px}.scratch.s1{left:102px;top:46px}.scratch.s2{left:67px;top:187px}.scratch.s3{right:49px;top:213px}
    .hurt .mouth{height:31px;border-radius:50%;border-top:5px solid #24152b;background:#63283a}.hurt .eye{height:13px;top:80px;border-radius:50%;background:#fff4dc}.hurt .brow.l{transform:rotate(-12deg)}.hurt .brow.r{transform:rotate(12deg)}
    .impact{position:absolute;z-index:20;pointer-events:none;width:20px;height:20px;transform:translate(-50%,-50%)}.impact i{position:absolute;left:9px;top:-20px;width:3px;height:18px;border-radius:3px;background:var(--gold);transform-origin:50% 30px}.impact i:nth-child(2){transform:rotate(60deg)}.impact i:nth-child(3){transform:rotate(120deg)}.impact i:nth-child(4){transform:rotate(180deg)}.impact i:nth-child(5){transform:rotate(240deg)}.impact i:nth-child(6){transform:rotate(300deg)}
    .pop{position:absolute;z-index:25;pointer-events:none;font-weight:1000;color:#fff;text-shadow:0 3px 0 #c62b45,0 5px 10px #000;transform:translate(-50%,-50%);font-size:25px;animation:pop .55s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4) rotate(-8deg)}30%{opacity:1;transform:translate(-50%,-80%) scale(1.2) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-170%) scale(.8) rotate(-4deg)}}
    .particle{position:absolute;z-index:19;width:8px;height:8px;border-radius:2px;background:var(--gold);pointer-events:none;animation:fly .5s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}
    .shake{animation:shake .28s ease-out}@keyframes shake{0%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(calc(-50% + var(--kick))) rotate(var(--rot)) scale(.98)}55%{transform:translateX(calc(-50% - var(--kick2))) rotate(calc(var(--rot) * -.4))}100%{transform:translateX(-50%) rotate(0)}}
    .combo{position:absolute;right:17px;top:21%;z-index:4;text-align:center;opacity:0;transform:scale(.5);transition:.16s;pointer-events:none}.combo.show{opacity:1;transform:scale(1)}.combo b{display:block;font-size:35px;line-height:.9;font-style:italic;color:var(--gold);text-shadow:3px 3px 0 #be3048}.combo span{font-size:10px;font-weight:950;letter-spacing:1.5px}
    .complete{position:absolute;inset:0;background:#171524dd;backdrop-filter:blur(7px);z-index:40;display:grid;place-items:center;padding:25px;opacity:0;pointer-events:none;transition:.25s}.complete.show{opacity:1;pointer-events:auto}.card{width:100%;text-align:center;background:linear-gradient(145deg,#302a47,#211e33);border:1px solid #ffffff1c;border-radius:27px;padding:27px 22px;box-shadow:0 25px 70px #0008;transform:translateY(18px);transition:.3s}.complete.show .card{transform:none}.emoji{font-size:53px}.card h2{margin:8px 0 5px;font-size:26px}.card p{color:#beb9cc;margin:0 0 20px;font-size:14px;line-height:1.6}.primary{border:0;border-radius:16px;padding:14px 20px;width:100%;font-weight:950;background:linear-gradient(90deg,#ff604e,#ef3a57);box-shadow:0 8px 20px #ff3d5940;cursor:pointer}
    footer{padding:8px 16px max(13px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:10px;z-index:6}.tip{background:#ffffff09;border:1px solid #ffffff10;border-radius:15px;padding:10px 12px;color:#aaa5bd;font-size:11px;line-height:1.35}.tip b{color:#fff}.reset{border:1px solid #ffffff18;background:#ffffff0c;border-radius:15px;padding:0 15px;font-weight:850;cursor:pointer}
    @media(max-height:650px){.character-wrap{transform:translateX(-50%) scale(.82);bottom:-8%;}.hint{top:2%}.stats{padding-top:0}header{padding-top:8px}.logo{width:36px;height:36px}.arena{min-height:220px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">A!</div><div><h1>Angry</h1><div class="sub">가볍게 탭하고, 기분은 가볍게</div></div></div>
    <button class="icon-btn" id="sound" aria-label="소리 끄기">🔊</button>
  </header>
  <main>
    <div class="stats">
      <div><div class="labelrow"><span>스트레스 해소</span><span id="percent">0%</span></div><div class="meter"><div class="fill" id="fill"></div></div></div>
      <div class="score"><small>점수</small><strong id="score">0</strong></div>
    </div>
    <section class="arena" id="arena" aria-label="Angry 캐릭터를 탭하는 게임 영역">
      <div class="hint" id="hint">👆 Angry를 탭해 보세요!</div>
      <div class="combo" id="combo"><b id="comboNum">2x</b><span>COMBO</span></div>
      <div class="character-wrap" id="target" role="button" tabindex="0" aria-label="탭해서 스트레스를 해소하기">
        <div class="character" id="character">
          <div class="ear l"></div><div class="ear r"></div>
          <div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div>
          <div class="body"></div>
          <div class="head"><div class="tuft"></div><div class="tuft t2"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div></div>
          <div class="bruise b1"></div><div class="bruise b2"></div><div class="scratch s1"></div><div class="scratch s2"></div><div class="scratch s3"></div>
        </div>
      </div>
      <div class="complete" id="complete"><div class="card"><div class="emoji">😌</div><h2>후— 한결 가벼워졌어요!</h2><p><b id="finalScore">0점</b>을 기록했어요.<br>깊게 숨을 쉬고 어깨의 힘을 빼 보세요.</p><button class="primary" id="again">한 번 더 하기</button></div></div>
    </section>
  </main>
  <footer><div class="tip"><b>TIP</b> 빠르게 연속 탭하면 콤보 점수가 올라가요. 상처는 만화풍으로만 표현돼요.</div><button class="reset" id="reset">초기화</button></footer>
</div>
<script>
(() => {
  const target=document.getElementById('target'), arena=document.getElementById('arena'), char=document.getElementById('character');
  const fill=document.getElementById('fill'), pct=document.getElementById('percent'), scoreEl=document.getElementById('score');
  const comboEl=document.getElementById('combo'),comboNum=document.getElementById('comboNum'),hint=document.getElementById('hint');
  const complete=document.getElementById('complete'), finalScore=document.getElementById('finalScore');
  let stress=0,score=0,combo=0,lastHit=0,soundOn=true,ctx=null,finished=false,comboTimer;
  const words=['퍽!','얍!','톡!','팡!','휙!'];
  function audio(freq=120){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(55,ctx.currentTime+.08);g.gain.setValueAtTime(.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.1)}catch(e){}}
  function hit(clientX,clientY){
    if(finished)return;
    const now=Date.now(),rect=arena.getBoundingClientRect(),tr=target.getBoundingClientRect();
    combo=(now-lastHit<620)?Math.min(combo+1,20):1;lastHit=now;
    const gain=2+Math.min(combo,8)*.35;stress=Math.min(100,stress+gain);score+=Math.round(10*combo);
    fill.style.width=stress+'%';pct.textContent=Math.floor(stress)+'%';scoreEl.textContent=score.toLocaleString('ko-KR');hint.style.display='none';
    if(combo>1){comboEl.classList.add('show');comboNum.textContent=combo+'x';clearTimeout(comboTimer);comboTimer=setTimeout(()=>comboEl.classList.remove('show'),800)}
    const localX=clientX-rect.left,localY=clientY-rect.top;
    const dir=clientX<(tr.left+tr.width/2)?1:-1;
    target.style.setProperty('--kick',(dir*18)+'px');target.style.setProperty('--kick2',(dir*7)+'px');target.style.setProperty('--rot',(dir*7)+'deg');
    target.classList.remove('shake');void target.offsetWidth;target.classList.add('shake');
    char.classList.add('hurt');setTimeout(()=>char.classList.remove('hurt'),180);
    const impact=document.createElement('div');impact.className='impact';impact.style.left=localX+'px';impact.style.top=localY+'px';impact.innerHTML='<i></i><i></i><i></i><i></i><i></i><i></i>';arena.appendChild(impact);setTimeout(()=>impact.remove(),300);
    const pop=document.createElement('div');pop.className='pop';pop.style.left=localX+'px';pop.style.top=localY+'px';pop.textContent=words[Math.floor(Math.random()*words.length)];arena.appendChild(pop);setTimeout(()=>pop.remove(),600);
    for(let i=0;i<5;i++){const p=document.createElement('i');p.className='particle';p.style.left=localX+'px';p.style.top=localY+'px';p.style.setProperty('--dx',((Math.random()-.5)*90)+'px');p.style.setProperty('--dy',(-20-Math.random()*65)+'px');p.style.background=i%2?'#ff6a50':'#ffd45d';arena.appendChild(p);setTimeout(()=>p.remove(),550)}
    const marks=[...document.querySelectorAll('.bruise,.scratch')];const visible=Math.min(marks.length,Math.floor(stress/17));marks.forEach((m,i)=>m.style.opacity=i<visible?Math.min(.82,(stress-i*12)/55):0);
    audio(145+Math.random()*35);if(navigator.vibrate)navigator.vibrate(18);
    if(stress>=100){finished=true;setTimeout(()=>{finalScore.textContent=score.toLocaleString('ko-KR')+'점';complete.classList.add('show');audio(330);setTimeout(()=>audio(440),120)},430)}
  }
  target.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX,e.clientY)});
  target.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=target.getBoundingClientRect();hit(r.left+r.width/2,r.top+r.height/3)}});
  function reset(){stress=0;score=0;combo=0;finished=false;lastHit=0;fill.style.width='0%';pct.textContent='0%';scoreEl.textContent='0';hint.style.display='block';complete.classList.remove('show');comboEl.classList.remove('show');document.querySelectorAll('.bruise,.scratch').forEach(m=>m.style.opacity=0)}
  document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
  document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';this.setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기')};
})();
</script>
</body>
</html>
