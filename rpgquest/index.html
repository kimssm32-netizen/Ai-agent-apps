ls{position:absolute;z-index:5;left:0;right:0;bottom:64px;height:135px;pointer-events:none}.stick{position:absolute;left:18px;bottom:7px;width:110px;height:110px;border-radius:50%;background:#0a112488;border:2px solid #fff2;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:29px;top:29px;border-radius:50%;background:#78dfff66;border:2px solid #dff}.acts{position:absolute;right:15px;bottom:6px;display:flex;gap:10px;align-items:end;pointer-events:auto}.act{border-radius:50%;width:58px;height:58px;background:linear-gradient(145deg,#6a70ed,#392a8c);font-size:11px;font-weight:900;box-shadow:0 4px 12px #0008}.attack{width:74px;height:74px;background:linear-gradient(145deg,#ff755c,#b71f50);font-size:15px}.act:active{transform:scale(.93)}.nav{position:absolute;z-index:12;left:0;right:0;bottom:0;height:62px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:#090f20ed;border-top:1px solid #fff2}.nav button{background:transparent;color:#8491ab;font-size:10px;font-weight:800}.nav i{font-style:normal;font-size:21px;display:block}.nav .on{color:#7ee9ff}.panel{display:none;position:absolute;z-index:10;inset:0 0 62px;overflow:auto;background:linear-gradient(155deg,#17203b,#080c16);padding:calc(18px + env(safe-area-inset-top)) 14px 25px}.panel.on{display:block}.panel h2{margin:2px 0 14px}.card{background:#151e34;border:1px solid #fff2;border-radius:15px;padding:13px;margin-bottom:11px}.card h3{margin:0 0 9px;color:#c9f7ff;font-size:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0b1224;border-radius:10px;padding:10px;font-size:12px}.stat small{color:#8e9bb5}.stat strong{float:right}.wide{width:100%;padding:13px;margin-top:8px;border-radius:11px;background:linear-gradient(90deg,#3678e8,#7048e5);font-weight:900}.wide:disabled{filter:grayscale(1);opacity:.5}.item{display:flex;align-items:center;gap:9px;padding:9px;background:#0c1428;border-radius:11px;margin:7px 0}.ico{width:39px;height:39px;display:grid;place-items:center;background:#263351;border-radius:9px;font-size:24px}.item .txt{flex:1}.item b{display:block;font-size:13px}.item small,.card p,.card>small{color:#9da9c0;font-size:11px}.mini{padding:7px 9px;border-radius:8px;background:#315fd4;font-size:11px}.jobcard{padding:13px;margin:8px 0;border-radius:13px;background:#0d1529;border:1px solid #fff2}.jobcard.lock{opacity:.45}.jobcard.chosen{border-color:#69e8ff}.jobcard b{font-size:16px}.jobcard p{margin:4px 0}.raid{background:linear-gradient(145deg,#351852,#141328)}.dragon{text-align:center;font-size:52px}.log{font-size:11px;color:#aab5ca;line-height:1.7}.levelup{display:none;position:absolute;z-index:30;inset:0;background:#050810dd;align-items:center;justify-content:center;padding:23px}.levelup.on{display:flex}.modal{width:100%;padding:22px;text-align:center;border-radius:20px;background:linear-gradient(155deg,#29375e,#101628);border:1px solid #72eaff88}.modal .star{font-size:55px}.modal h2{color:#ffe47b}.choices{display:grid;gap:8px}.choices button{text-align:left;padding:12px;border-radius:11px;background:#172542;border:1px solid #fff2}.choices b{color:#80e9ff}.damage{position:absolute;z-index:6;font-size:18px;font-weight:1000;text-shadow:0 2px 3px #000;animation:fly .7s forwards;pointer-events:none}@keyframes fly{to{transform:translateY(-50px) scale(1.3);opacity:0}}

<body><div class="app">
<canvas id="game"></canvas>
<header class="top"><div class="face">🛡️</div><div class="info"><div class="line"><span id="level"></span><span class="job" id="job"></span></div><div class="bar"><div class="fill hp" id="hpf"></div><span id="hpt"></span></div><div class="bar"><div class="fill xp" id="xpf"></div><span id="xpt"></span></div></div><div class="gold">🪙 <span id="gold"></span></div></header>
<div class="quest"><b>📜 초보 사냥꾼</b><span id="quest"></span></div><div class="bossbar" id="bossbar"><span id="bossname"></span><div class="bar"><div class="fill" id="bossfill"></div></div></div><div class="toast" id="toast"></div>
<div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="acts"><button class="act" id="skill">스킬<br>⚡</button><button class="act attack" id="attack">공격<br>⚔️</button></div></div>
<nav class="nav"><button class="on" data-tab="field"><i>🗺️</i>필드</button><button data-tab="char"><i>👤</i>캐릭터</button><button data-tab="bag"><i>🎒</i>가방</button><button data-tab="jobs"><i>✨</i>전직</button><button data-tab="raid"><i>🐲</i>레이드</button></nav>
<section class="panel" id="char"><h2>내 캐릭터</h2><div class="card"><h3 id="ctitle"></h3><div class="stats"><div class="stat"><small>공격력</small><strong id="atk"></strong></div><div class="stat"><small>방어력</small><strong id="def"></strong></div><div class="stat"><small>최대 HP</small><strong id="mhp"></strong></div><div class="stat"><small>치명타</small><strong id="crit"></strong></div></div></div><div class="card"><h3>능력치 포인트: <span id="points"></span></h3><button class="wide" onclick="statUp('atk')">공격력 +2</button><button class="wide" onclick="statUp('hp')">최대 HP +10</button></div><div class="card"><h3>모험 기록</h3><div class="log" id="record"></div><button class="wide" style="background:#783647" onclick="resetGame()">저장 데이터 초기화</button></div></section>
<section class="panel" id="bag"><h2>가방 & 장비</h2><div class="card"><h3>장착 장비</h3><div id="equip"></div></div><div class="card"><h3>전리품</h3><div id="items"></div></div></section>
<section class="panel" id="jobs"><h2>전직</h2><div class="card"><small>레벨 5에 1차 전직, 레벨 12에 상위 전직이 열립니다.</small></div><div id="joblist"></div></section>
<section class="panel" id="raid"><h2>레이드</h2><div class="card raid"><div class="dragon">🐲</div><h3 style="text-align:center">고대 화염룡 이그니스</h3><p>45초 안에 보스를 처치하세요. 승리하면 희귀 장비와 대량의 경험치를 얻습니다.</p><div class="stats"><div class="stat"><small>권장 레벨</small><strong>5</strong></div><div class="stat"><small>입장료</small><strong>100 G</strong></div></div><button class="wide" id="raidBtn">레이드 시작</button></div><div class="card"><h3>공략</h3><div class="log">보스에게 접근해 공격하세요.<br>스킬은 강력하지만 5초의 재사용 시간이 있습니다.<br>실패해도 입장료 외 불이익은 없습니다.</div></div></section>
<div class="levelup" id="levelup"><div class="modal"><div class="star">🌟</div><h2>LEVEL UP!</h2><p id="lvmsg"></p><div class="choices"><button onclick="choose('atk')"><b>⚔️ 힘의 축복</b><br><small>공격력 영구 +3</small></button><button onclick="choose('hp')"><b>❤️ 생명의 축복</b><br><small>최대 HP 영구 +15</small></button><button onclick="choose('gold')"><b>🪙 행운의 축복</b><br><small>골드 +100</small></button></div></div></div>
</div><script>
const $=q=>document.querySelector(q),C=$('#game'),X=C.getContext('2d');let W,H,D,last=0,joy={x:0,y:0},attackT=0,skillCD=0,inRaid=false,raidT=0;
const base={level:1,xp:0,gold:0,hp:100,maxHp:100,atk:12,def:3,crit:5,points:0,job:'견습생',kills:0,wins:0,quest:0,items:[],equip:null,x:0,y:0};let S=Object.assign({},base,JSON.parse(localStorage.getItem('rpgquest-save')||'{}')),E=[],P=[];
const mons=[{icon:'🟢',name:'슬라임',hp:28,atk:4,xp:18,gold:12},{icon:'🐺',name:'들개',hp:50,atk:7,xp:28,gold:20},{icon:'👺',name:'고블린',hp:80,atk:10,xp:42,gold:28}];
const jobs=[['견습생',1,'🛡️','모든 모험가의 시작'],['검사',5,'⚔️','튼튼한 근접 전사'],['마법사',5,'🔮','강력한 마법 공격'],['레인저',5,'🏹','높은 치명타 확률'],['기사',12,'🐴','검사의 상위 직업','검사'],['대마법사',12,'🌌','마법사의 상위 직업','마법사'],['명사수',12,'🎯','레인저의 상위 직업','레인저']];
function resize(){D=Math.min(2,devicePixelRatio||1);W=C.clientWidth;H=C.clientHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function need(){return 70+S.level*45}function save(){localStorage.setItem('rpgquest-save',JSON.stringify(S))}function stats(){let a=S.atk,d=S.def,c=S.crit;if(S.job==='검사')d+=5;if(S.job==='마법사')a+=6;if(S.job==='레인저')c+=12;if(S.job==='기사')d+=13;if(S.job==='대마법사')a+=16;if(S.job==='명사수')c+=25;if(S.equip){a+=S.equip.atk;d+=S.equip.def}return{a,d,c}}
function ui(){let z=stats();$('#level').textContent='Lv.'+S.level+' 모험가';$('#job').textContent=S.job;$('#hpf').style.width=S.hp/S.maxHp*100+'%';$('#hpt').textContent=Math.ceil(S.hp)+' / '+S.maxHp;$('#xpf').style.width=S.xp/need()*100+'%';$('#xpt').textContent='EXP '+S.xp+' / '+need();$('#gold').textContent=S.gold;$('#quest').textContent=S.quest<5?'슬라임 '+S.quest+' / 5':'완료 ✓';$('#ctitle').textContent='Lv.'+S.level+' '+S.job;$('#atk').textContent=z.a;$('#def').textContent=z.d;$('#mhp').textContent=S.maxHp;$('#crit').textContent=z.c+'%';$('#points').textContent=S.points;$('#record').innerHTML='처치한 몬스터: '+S.kills+'마리<br>레이드 승리: '+S.wins+'회';renderJobs();renderBag();save()}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1400)}
function spawn(){if(inRaid)return;let m=mons[Math.min(2,Math.floor(Math.random()*(1+S.level/4)))],a=Math.random()*6.28,r=5+Math.random()*8;E.push({...m,hp:m.hp+S.level*3,max:m.hp+S.level*3,x:S.x+Math.cos(a)*r,y:S.y+Math.sin(a)*r,cd:0,hit:0})}for(let i=0;i<7;i++)spawn();
function strike(skill){if(attackT>0||(skill&&skillCD>0))return;attackT=.25;if(skill)skillCD=5;let z=stats(),hit=false;E.forEach(e=>{if(Math.hypot(e.x-S.x,e.y-S.y)<(skill?4.2:2.5)){let crit=Math.random()*100<z.c,n=Math.round(z.a*(skill?2.3:1)*(crit?1.8:1)*(.85+Math.random()*.3));e.hp-=n;e.hit=.15;hit=true;damage(n,crit);for(let i=0;i<7;i++)P.push({x:e.x,y:e.y,z:.4,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:Math.random()*2,life:.6,c:skill?'#7ff3ff':'#ffd85e'})}});if(!hit)toast('적이 너무 멀어요')}
$('#attack').onpointerdown=e=>{e.preventDefault();strike(false)};$('#skill').onpointerdown=e=>{e.preventDefault();strike(true)};function damage(n,c){let d=document.createElement('div');d.className='damage';d.style.left=W/2+(Math.random()-.5)*70+'px';d.style.top=H*.42+'px';d.style.color=c?'#ffe65b':'#fff';d.textContent=(c?'치명타! ':'')+n;$('.app').append(d);setTimeout(()=>d.remove(),750)}
function reward(e){S.xp+=e.xp;S.gold+=e.gold;S.kills++;if(e.name==='슬라임'&&S.quest<5){S.quest++;if(S.quest===5){S.gold+=100;S.xp+=80;toast('퀘스트 완료! 100G + 80EXP')}}if(Math.random()<.17){let rare=Math.random()<.16,names=['철검','가죽 갑옷','마력 반지'],icons=['🗡️','🥋','💍'],i=Math.floor(Math.random()*3);S.items.push({id:Date.now()+Math.random(),name:(rare?'빛나는 ':'')+names[i],icon:icons[i],atk:rare?8:3,def:rare?5:2});toast('새 장비 획득!')}while(S.xp>=need()){S.xp-=need();S.level++;S.points++;S.maxHp+=8;S.hp=S.maxHp;$('#lvmsg').textContent='레벨 '+S.level+' 달성! 보너스를 선택하세요.';$('#levelup').classList.add('on')}ui()}
window.choose=k=>{if(k==='atk')S.atk+=3;if(k==='hp'){S.maxHp+=15;S.hp=S.maxHp}if(k==='gold')S.gold+=100;$('#levelup').classList.remove('on');if(S.level===5||S.level===12)toast('새 전직이 열렸습니다!');ui()};window.statUp=k=>{if(!S.points)return toast('포인트가 없어요');S.points--;if(k==='atk')S.atk+=2;else{S.maxHp+=10;S.hp+=10}ui()};window.resetGame=()=>{if(confirm('진행 상황을 모두 초기화할까요?')){localStorage.removeItem('rpgquest-save');location.reload()}};
function renderJobs(){let el=$('#joblist');el.innerHTML='';jobs.forEach(j=>{let lock=S.level<j[1]||(j[4]&&S.job!==j[4]&&S.job!==j[0]),d=document.createElement('div');d.className='jobcard '+(lock?'lock ':'')+(S.job===j[0]?'chosen':'');d.innerHTML='<b>'+j[2]+' '+j[0]+'</b><p>'+j[3]+'</p><small>'+(lock?'🔒 Lv.'+j[1]+(j[4]?' · '+j[4]:''):S.job===j[0]?'현재 직업':'탭하여 전직')+'</small>';if(!lock&&S.job!==j[0])d.onclick=()=>{S.job=j[0];toast(j[0]+' 전직 완료!');ui()};el.append(d)})}
function renderBag(){let eq=$('#equip'),it=$('#items');eq.innerHTML=S.equip?itemHTML(S.equip):'<small>장착한 장비가 없습니다.</small>';it.innerHTML=S.items.length?'':'<small>사냥으로 장비를 획득하세요.</small>';S.items.forEach((o,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=itemHTML(o,true);d.querySelector('button').onclick=()=>{if(S.equip)S.items.push(S.equip);S.equip=o;S.items.splice(i,1);toast('장비 장착 완료');ui()};it.append(d)})}function itemHTML(o,btn){return '<div class="ico">'+o.icon+'</div><div class="txt"><b>'+o.name+'</b><small>공격 +'+o.atk+' · 방어 +'+o.def+'</small></div>'+(btn?'<button class="mini">장착</button>':'')}
let jid;function jmove(e){let r=$('#stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=34;if(l>m){x*=m/l;y*=m/l}joy={x:x/m,y:y/m};$('#knob').style.transform='translate('+x+'px,'+y+'px)'}$('#stick').onpointerdown=e=>{jid=e.pointerId;e.currentTarget.setPointerCapture(jid);jmove(e)};$('#stick').onpointermove=e=>{if(e.pointerId===jid)jmove(e)};$('#stick').onpointerup=$('#stick').onpointercancel=()=>{jid=null;joy={x:0,y:0};$('#knob').style.transform=''};
$('.nav').onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));if(b.dataset.tab!=='field')$('#'+b.dataset.tab).classList.add('on');ui()};
$('#raidBtn').onclick=()=>{if(S.level<5)return toast('레벨 5부터 입장 가능해요');if(S.gold<100)return toast('골드가 부족해요');S.gold-=100;inRaid=true;raidT=45;E=[];S.x=S.y=0;let h=850+S.level*70;E.push({icon:'🐲',name:'이그니스',hp:h,max:h,atk:18+S.level*2,x:0,y:-6,cd:1,boss:true,hit:0});document.querySelector('[data-tab="field"]').click();$('#bossbar').style.display='block';toast('레이드 시작!');ui()};function raidEnd(win){inRaid=false;$('#bossbar').style.display='none';E=[];if(win){S.wins++;S.gold+=500;S.xp+=300;S.items.push({id:Date.now(),name:'용염의 대검',icon:'🔥',atk:15,def:4});toast('승리! 전설 장비 획득')}else toast('레이드 실패...');S.hp=S.maxHp;for(let i=0;i<7;i++)spawn();ui()}
function update(dt){if(document.querySelector('.panel.on')||$('#levelup').classList.contains('on'))return;S.x+=joy.x*3.5*dt;S.y+=joy.y*3.5*dt;attackT=Math.max(0,attackT-dt);skillCD=Math.max(0,skillCD-dt);$('#skill').innerHTML=skillCD>0?'스킬<br>'+skillCD.toFixed(1):'스킬<br>⚡';E.forEach(e=>{e.hit=Math.max(0,e.hit-dt);e.cd-=dt;let dx=S.x-e.x,dy=S.y-e.y,d=Math.hypot(dx,dy);if(d<7&&d>1.4){let sp=e.boss?1.2:1.05;e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt}if(d<1.8&&e.cd<=0){e.cd=e.boss?1.2:2;let n=Math.max(1,Math.round(e.atk-stats().d*.35));S.hp-=n;damage(n,false);if(S.hp<=0){if(inRaid)raidEnd(false);else{S.hp=S.maxHp;S.gold=Math.max(0,S.gold-30);S.x=S.y=0;toast('쓰러졌습니다...')}}}});let dead=E.filter(e=>e.hp<=0);E=E.filter(e=>e.hp>0);dead.forEach(e=>e.boss?raidEnd(true):reward(e));if(!inRaid)while(E.length<7)spawn();else{raidT-=dt;let b=E[0];if(b){$('#bossname').textContent='이그니스 · '+Math.ceil(raidT)+'초';$('#bossfill').style.width=b.hp/b.max*100+'%'}if(raidT<=0)raidEnd(false)}P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=4*dt;p.life-=dt});P=P.filter(p=>p.life>0);$('#hpf').style.width=S.hp/S.maxHp*100+'%';$('#hpt').textContent=Math.ceil(S.hp)+' / '+S.maxHp}
function project(x,y,z=0){let rx=x-S.x,ry=y-S.y,dep=ry+10,sc=46/(1+dep*.035);return{x:W/2+rx*sc,y:H*.50+ry*18-z*sc,s:sc,d:dep}}
function draw(){let g=X.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,inRaid?'#260d38':'#163867');g.addColorStop(1,inRaid?'#9a3e4d':'#68b8d0');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle=inRaid?'#38243b':'#28463b';X.beginPath();X.moveTo(0,H*.4);for(let x=0;x<=W;x+=30)X.lineTo(x,H*.37-Math.sin(x*.03)*18);X.lineTo(W,H*.55);X.lineTo(0,H*.55);X.fill();g=X.createLinearGradient(0,H*.43,0,H);g.addColorStop(0,inRaid?'#452632':'#45694e');g.addColorStop(1,inRaid?'#15121b':'#172b24');X.fillStyle=g;X.fillRect(0,H*.43,W,H);X.strokeStyle=inRaid?'#ff685522':'#c9ffd51c';for(let i=-9;i<=9;i++){X.beginPath();X.moveTo(W/2+i*3,H*.43);X.lineTo(W/2+i*50,H);X.stroke()}for(let y=H*.49;y<H;y+=(y-H*.4)*.14){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
let list=E.map(o=>({o,p:project(o.x,o.y,o.boss?1:.45)}));list.push({player:true,p:project(S.x,S.y,.5)});list.sort((a,b)=>b.p.d-a.p.d);list.forEach(t=>{let p=t.p;if(p.d<-9||p.d>25)return;X.textAlign='center';X.fillStyle='#0006';X.beginPath();X.ellipse(p.x,p.y+5,p.s*.35,p.s*.11,0,0,7);X.fill();if(t.player){X.font=Math.max(30,p.s*.95)+'px serif';X.fillText(attackT>0?'⚔️':'🧙',p.x,p.y)}else{let e=t.o;X.globalAlpha=e.hit?0.45:1;X.font=Math.max(27,p.s*(e.boss?1.5:.85))+'px serif';X.fillText(e.icon,p.x,p.y);X.globalAlpha=1;let bw=e.boss?80:42;X.fillStyle='#130c18';X.fillRect(p.x-bw/2,p.y-p.s*(e.boss?1.55:.9)-8,bw,5);X.fillStyle=e.boss?'#d445cf':'#e94d68';X.fillRect(p.x-bw/2,p.y-p.s*(e.boss?1.55:.9)-8,bw*e.hp/e.max,5)}});P.forEach(o=>{let p=project(o.x,o.y,o.z);X.fillStyle=o.c;X.beginPath();X.arc(p.x,p.y,3,0,7);X.fill()});X.textAlign='left'}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);
</script></body></html>
